name: Deploy Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Pipeline Secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "❌ ERROR: EC2_HOST secret is empty! Please add it to Repository Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "❌ ERROR: EC2_USER secret is empty! Please add it to Repository Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "❌ ERROR: EC2_SSH_KEY secret is empty! Please add it to Repository Secrets."
            exit 1
          fi
          echo "✅ All required repository secrets are loaded properly."

      - name: Setup SSH Environment
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy_key
          chmod 600 ~/.ssh/id_deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Website
        run: |
          # 1. Prepare remote folder
          ssh -i ~/.ssh/id_deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /tmp/website/"

          # 2. Sync application assets over the wire
          rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy_key" --exclude '.git*' ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/website/

          # 3. Swap live Nginx web deployment files
          ssh -i ~/.ssh/id_deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/website/* /var/www/html/
          "
