name: Deploy Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy_key
          chmod 600 ~/.ssh/id_deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Website
        run: |
          # Create the staging directory on the remote instance first to avoid file-mapping issues
          ssh -i ~/.ssh/id_deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /tmp/website/"

          # Sync application assets (Keep this entirely on one line)
          rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy_key" --exclude '.git*' ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/website/

          # Swap out old web assets with the freshly staged files
          ssh -i ~/.ssh/id_deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/website/* /var/www/html/
          "
